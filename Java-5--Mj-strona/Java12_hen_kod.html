<textarea style="width:100%; height:100vh; box-sizing:border-box;">
<!DOCTYPE html>   
<head>    
<title> Hennig 2P</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 

var D1_hen=prompt("Dzień1=","");
var G1_hen=prompt("Godź1=","");  
var D2_hen=prompt("Dzień2=",""); 
var G2_hen=prompt("Godź2=",""); 

var ah; 
var bh; 
var ap; 
var bp; 
var kir; 
var czas; 

var a=parseFloat(D1_hen); 
var i=parseFloat(G1_hen); 
var b=parseFloat(D2_hen); 
var j=parseFloat(G2_hen); 

ah=a*24;
bh=b*24;

ap=ah-24+i;
bp=bh-24+j;

czas=ap-bp;
kir=czas*60*60;

document.write("D1="+D1_hen+"<br>"); 
document.write("G1="+G1_hen+"<br>"); 
document.write("D2="+D2_hen+"<br>"); 
document.write("G2="+G2_hen+"<br>"); 
document.write("ilość sekund="+kir+" sekund <br>"); 

</script> 
</div> 
</body> 
</html>
