<body bgcolor="yellow"> 

<div style="color:green;font-size:40px;"> 

<script type="text/javascript">


function Dom(wysokosc, adres, czapka, wlasciciel) {
    this.wysokosc = wysokosc;
    this.adres = adres;
    this.czapka = czapka;
    this.wlasciciel = wlasciciel;
}


Dom.prototype.Dom_wyswietl_Hennig = function() {
    document.write("Wysokość: " + this.wysokosc + "<br>");
    document.write("Adres: " + this.adres + "<br>");
    document.write("Czapka: " + this.czapka + "<br>");
    document.write("Właściciel: " + this.wlasciciel + "<br>");
};


var dom1 = new Dom("67m", "ul. Nopekińska", "zielony Tophat", "Hennig");
var dom2 = new Dom("20m", "ul. Ogórkowa", "niebieska czapka", "Kowalski");
var dom3 = new Dom("50m", "ul. Szczurkowa", "czerwona czapka", "Nowak");


document.write("OBIEKT DOM1<br>");
dom1.Dom_wyswietl_Hennig();

document.write("<br>OBIEKT DOM2<br>");
dom2.Dom_wyswietl_Hennig();

document.write("<br>OBIEKT DOM3<br>");
dom3.Dom_wyswietl_Hennig();


dom1.nowePole = "Mój dodatkowy wpis";


dom1.dom_pokaz_Hennig = function() {
    document.write("Nowe pole: " + this.nowePole + "<br>");
};

document.write("<br>NOWA METODA<br>");
dom1.dom_pokaz_Hennig();

</script>
</div>
