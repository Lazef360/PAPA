<!DOCTYPE html>   
<head>    
<title> Użycie fukcji </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 

function suma_hen(a, b) { return a + b; } 
function odejmowanie_hen(a, b) { return a - b; } 
function mnożenie_hen(a, b) { return a * b; } 
function od_kwadratu_hen(b) { return b ** 2; } 
function od_kwadratu_hen(a) { return a ** 2 ;} 
function reszta_z_dzielenia_a_przez_b_hen(a, b) { return a % b; } 



document.write("suma="+suma_hen(a,b)+"<br>"); 
document.write("odejmowanie="+odejmowanie_hen(a,b)+"<br>"); 
document.write("mnożenie="+mnożenie_hen(a,b)+"<br>"); 
document.write("kwadrat a="+od_kwadratu_hen(a)+"<br>"); 
document.write("kwadrat b="+od_kwadratu_hen(b)+"<br>"); 
document.write("reszta="+reszta_z_dzielenia_a_przez_b_hen(a,b)+"<br>"); 
</script> 
</div> 
</body>
